name: Commit checks

on: [push]

jobs:
  playwright-chromium:
    name: Playwright Chrome test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Restore packages cache
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          yarn install --frozen-lockfile --ignore-scripts
          npm rebuild node-sass
          rm .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install playwright browsers
        run: yarn playwright install chromium

      - name: Run Cucumber Giftaid Sanity Tests
        run: yarn test:ci:chromium
        continue-on-error: false
        env:
          NODE_ENV: development
          REACT_APP_ENDPOINT_URL: ${{ secrets.REACT_APP_ENDPOINT_URL }}
          FORCE_COLOR: 1

      - name: List Playwright artifacts
        if: failure()
        run: find playwright-local/test-results -type f || true

      # Upload Playwright video and trace artifacts for failed scenarios only
      - name: playwright-chromium-artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-chromium
          path: |
            playwright-local/test-results/failed-videos/**/*.webm
            playwright-local/test-results/traces/**/*.zip
          retention-days: 3

  playwright-mobile:
    name: Playwright Mobile test
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Restore packages cache
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          yarn install --frozen-lockfile --ignore-scripts
          npm rebuild node-sass
          rm .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install WebKit system dependencies
        run: yarn playwright install-deps webkit

      - name: Install playwright browsers (WebKit)
        run: yarn playwright install webkit

      - name: Run Mobile Cucumber Tests
        run: yarn test:ci:mobile
        continue-on-error: false
        env:
          NODE_ENV: development
          REACT_APP_ENDPOINT_URL: ${{ secrets.REACT_APP_ENDPOINT_URL }}
          FORCE_COLOR: 1

      - name: List Playwright artifacts
        if: failure()
        run: find playwright-local/test-results -type f || true

      # Upload Playwright video and trace artifacts for failed scenarios only
      - name: playwright-mobile-artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-mobile
          path: |
            playwright-local/test-results/failed-videos/**/*.webm
            playwright-local/test-results/traces/**/*.zip
          retention-days: 3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Restore packages cache
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          yarn install --frozen-lockfile --ignore-scripts
          npm rebuild node-sass
          rm .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run ESLint
        run: yarn lint
